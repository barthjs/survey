services:
  survey:
    image: barthjs/survey:latest
    container_name: survey
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 8080:8080
    volumes:
      - ./app_data:/app/storage/app
    env_file: .env
    networks:
      - default
      - backend

  database:
    image: postgres:18-alpine
    container_name: survey-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $DB_DATABASE -U $DB_USERNAME" ]
      interval: 30s
      timeout: 5s
      start_period: 3s
      retries: 3
    volumes:
      - ./db_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - backend

networks:
  backend:
    internal: true
